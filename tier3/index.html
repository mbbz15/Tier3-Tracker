<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Tier 3 Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* Five views behind tabs, one job each: what is short, what to go after,
   which permits are running out, who already sells it, and the calendar.
   Hikma coral marks anything that needs action, Hikma blue carries the
   structure, the rest is white. Bricolage Grotesque for names and
   headings, Atkinson Hyperlegible for reading. Light only. */
:root{
--white:#ffffff;--navy:#13294b;--navy-2:#2b4475;--mist:#eef2f8;
--line:#e4e9f1;--coral:#ff5c57;--coral-ink:#c4302b;--coral-tint:#ffe9e8;
--ink:#17213a;--slate:#5b6880;--fog:#cbd3df;
--display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
--text:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
--names:290px;color-scheme:light}
*{box-sizing:border-box}
html{background:var(--white)}
body{margin:0;background:var(--white);color:var(--ink);
font:16px/1.55 var(--text);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.page{max-width:1180px;margin:0 auto;padding:36px 28px 72px}

/* ---------- top ---------- */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;
align-items:flex-end;gap:12px 24px}
h1{font:800 clamp(36px,5vw,56px)/1 var(--display);margin:0;
letter-spacing:-.03em;color:var(--navy)}
h1 .dot{display:inline-block;width:.22em;height:.22em;border-radius:50%;
background:var(--coral);margin-left:.06em;vertical-align:.08em}
.when{color:var(--slate);font-size:14px;text-align:right}
.when b{color:var(--navy)}
.stale{margin:20px 0 0;padding:12px 16px;border-radius:10px;
background:var(--coral-tint);color:var(--coral-ink);font-weight:700}

/* ---------- tabs ---------- */
.tabs{position:sticky;top:0;z-index:5;background:var(--white);
margin:24px -28px 0;padding:0 28px;border-bottom:1px solid var(--line);
display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:14px 14px 12px;cursor:pointer;
font:700 16px/1 var(--display);color:var(--slate);white-space:nowrap;
border-bottom:3px solid transparent;display:flex;align-items:center;gap:8px}
.tab:hover{color:var(--navy)}
.tab[aria-selected=true]{color:var(--navy);border-bottom-color:var(--coral)}
.tab:focus-visible{outline:2px solid var(--coral);outline-offset:-2px}
.n{font:700 12px/1 var(--text);background:var(--mist);color:var(--navy-2);
border-radius:999px;padding:4px 7px}
.n.hot{background:var(--coral);color:var(--white)}
.panel{padding-top:28px}
.lede{margin:0 0 20px;font-size:18px;max-width:64ch}
.lede b{color:var(--navy)}
.lede .hot{color:var(--coral-ink)}
.help{margin:-8px 0 22px;color:var(--slate);font-size:14.5px;max-width:72ch}

/* ---------- controls ---------- */
.tools{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;
margin:0 0 14px}
.find{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:10px;
border-bottom:2px solid var(--navy);padding:4px 2px 8px}
.find svg{flex:none;color:var(--navy)}
.find input{border:0;outline:0;background:none;width:100%;font-size:17px}
.find input::placeholder{color:var(--slate)}
.find:focus-within{border-color:var(--coral)}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--mist);
border-radius:999px;padding:4px}
.seg button{border:0;background:none;border-radius:999px;padding:7px 13px;
cursor:pointer;font-size:14px;color:var(--navy-2)}
.seg button[aria-pressed=true]{background:var(--white);color:var(--navy);
font-weight:700;box-shadow:0 1px 3px rgba(19,41,75,.18)}
.seg button:focus-visible{outline:2px solid var(--coral)}

/* ---------- overview list ---------- */
.list{border-top:2px solid var(--navy)}
.li{width:100%;border:0;background:none;text-align:left;cursor:pointer;
display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.5fr)
minmax(0,1.9fr) minmax(0,1.1fr) 20px;gap:16px;align-items:center;
padding:14px 6px;border-bottom:1px solid var(--line)}
.li:hover,.li:focus-visible{background:#f8fafd;outline:0}
.li:focus-visible{box-shadow:inset 3px 0 0 var(--coral)}
.li.head{cursor:default;padding:10px 6px;font-size:13px;color:var(--slate)}
.li.head:hover{background:none}
.name{font:700 18px/1.2 var(--display);color:var(--navy)}
.sub{font-size:14px;color:var(--slate);margin-top:3px;display:flex;
flex-wrap:wrap;gap:6px 8px;align-items:center}
.hk{font:700 11.5px/1 var(--text);color:var(--white);background:var(--coral);
border-radius:999px;padding:4px 8px}
.chev{width:9px;height:9px;border-right:2px solid var(--fog);
border-bottom:2px solid var(--fog);transform:rotate(-45deg)}
.li:hover .chev{border-color:var(--navy)}
.tag{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;
padding:3px 9px;white-space:nowrap}
.tag.sh{background:var(--coral);color:var(--white)}
.tag.ex{background:var(--coral-tint);color:var(--coral-ink)}
.tag.ok{background:var(--navy);color:var(--white)}
.tag.dn{background:var(--mist);color:var(--slate)}
.t3{font-size:12.5px;color:var(--navy-2);font-weight:700;margin-left:6px}
.cell{font-size:14.5px;line-height:1.35}
.cell.hot{color:var(--coral-ink);font-weight:700}
.cell .muted{color:var(--slate)}
.none{padding:40px 0;color:var(--slate);font-size:17px}

/* ---------- suggestions ---------- */
.sug{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
gap:18px}
.idea{border:1px solid var(--line);border-radius:16px;padding:20px 22px;
display:flex;flex-direction:column;gap:12px;background:var(--white)}
.idea{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.idea:hover,.idea:focus-visible{border-color:var(--coral);
box-shadow:0 0 0 1px var(--coral);outline:none}
.idea-head{display:flex;justify-content:space-between;align-items:start;gap:12px}
.rank{font:800 15px/1 var(--display);color:var(--slate)}
.idea h3{margin:4px 0 0;font:800 24px/1.1 var(--display);color:var(--navy);
letter-spacing:-.01em}
.pts{text-align:right;flex:none}
.pts b{display:block;font:800 30px/1 var(--display);color:var(--coral-ink)}
.pts span{font-size:12.5px;color:var(--slate)}
.meter{height:6px;border-radius:999px;background:var(--mist);overflow:hidden}
.meter i{display:block;height:100%;background:var(--coral);border-radius:999px}
.why{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:15px}
.why li{display:grid;grid-template-columns:18px 1fr;gap:8px}
.why li:before{content:"";width:8px;height:8px;border-radius:50%;
background:var(--coral);margin-top:8px}
.why li.mine:before{background:var(--navy)}
.open{align-self:flex-start;margin-top:auto;border:0;background:var(--mist);
color:var(--navy);font-weight:700;border-radius:999px;padding:8px 16px;
cursor:pointer}
.open:hover{background:var(--navy);color:var(--white)}

/* ---------- permits ---------- */
.permits{border-top:2px solid var(--navy)}
.pm{display:grid;grid-template-columns:120px minmax(0,2.4fr) minmax(0,1.4fr)
minmax(0,1fr);gap:18px;padding:16px 6px;border-bottom:1px solid var(--line);
align-items:start}
.pm .date b{display:block;font:800 22px/1.05 var(--display);color:var(--navy)}
.pm .date span{font-size:13px;color:var(--slate)}
.pm.soon .date b{color:var(--coral-ink)}
.pm .prod{font-weight:700;color:var(--navy)}
.pm .meta{font-size:14px;color:var(--slate);margin-top:2px}
.pm .left{font-size:14.5px}
.pm.gone{opacity:.65}

/* ---------- sellers ---------- */
.sell{border-top:2px solid var(--navy)}
.sell details{border-bottom:1px solid var(--line)}
.sell summary{list-style:none;cursor:pointer;display:grid;
grid-template-columns:minmax(0,1.6fr) minmax(0,2fr) 20px;gap:16px;
align-items:center;padding:14px 6px}
.sell summary::-webkit-details-marker{display:none}
.sell summary:hover{background:#f8fafd}
.sell summary:focus-visible{outline:2px solid var(--coral);outline-offset:-2px}
.sell details[open] .chev{transform:rotate(45deg)}
.count{font-size:15px}
.count b{color:var(--navy)}
.count.hot b{color:var(--coral-ink)}
.tbl{width:100%;border-collapse:collapse;margin:0 0 16px;font-size:14.5px}
.tbl th{text-align:left;font-weight:700;color:var(--slate);font-size:13px;
padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.wrapx{overflow-x:auto;padding:0 6px}

/* ---------- calendar ---------- */
.key{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:13.5px;
color:var(--slate);margin:0 0 10px}
.key span{display:inline-flex;align-items:center;gap:8px}
.sw{display:inline-block;width:26px;height:10px;border-radius:3px}
.cal{position:relative;border-top:2px solid var(--navy)}
.cal-in{min-width:760px}
.axis,.lane{display:grid;grid-template-columns:var(--names) minmax(0,1fr)}
.axis{border-bottom:1px solid var(--line)}
.axis .lbl{font-size:13px;color:var(--slate);padding:10px 0 8px}
.ticks{position:relative;height:40px}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);
padding:10px 0 0 6px;font-size:12.5px;color:var(--slate);white-space:nowrap}
.tick.yr{border-left:2px solid var(--navy-2);color:var(--navy);font-weight:700}
.lane{width:100%;text-align:left;border:0;background:none;padding:0;
cursor:pointer;border-bottom:1px solid var(--line)}
.lane:hover,.lane:focus-visible{background:#f8fafd;outline:0}
.lane:focus-visible .who{box-shadow:inset 3px 0 0 var(--coral)}
.who{padding:12px 16px 12px 0;min-width:0}
.who .name{font-size:16.5px}
.track{position:relative;min-height:64px}
.grid{position:absolute;inset:0;pointer-events:none}
.grid i{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.grid i.yr{border-left:1px solid var(--fog)}
.bar{position:absolute;height:14px;border-radius:5px;top:16px;
transform-origin:left center;animation:grow .6s cubic-bezier(.2,.8,.2,1) both}
.bar.sh{background:var(--coral)}
.bar.ex{background:repeating-linear-gradient(135deg,var(--coral) 0 6px,
#ff8e8a 6px 12px)}
.bar.dn{background:var(--fog)}
.bar.tail{background:none;border:2px dashed var(--coral);border-left:0;
box-sizing:border-box;border-radius:0 5px 5px 0}
.bar.past{border-top-right-radius:0;border-bottom-right-radius:0}
.endlbl{position:absolute;transform:translate(6px,-1px);z-index:3;
font:700 11.5px/1 var(--text);color:var(--coral-ink);background:var(--white);
padding:3px 6px;border-radius:5px;white-space:nowrap;pointer-events:none;
box-shadow:0 0 0 1px var(--line)}
.endlbl.left{transform:translate(calc(-100% - 6px),-1px)}
.endlbl.im{font-size:11px;font-weight:600;color:var(--navy);padding:2px 5px}
.track{min-height:70px}
.bar.cut{border-top-left-radius:0;border-bottom-left-radius:0}
.bar.im{height:8px;background:var(--navy);border-radius:999px}
.bar.im.soon{background:linear-gradient(90deg,var(--navy) 70%,var(--coral))}
.bar.im.old{background:var(--fog)}
.today{position:absolute;top:0;bottom:0;width:0;
border-left:2px solid var(--coral);z-index:2;pointer-events:none}
.today b{position:absolute;bottom:-11px;left:-24px;width:48px;text-align:center;
font:700 12px/1 var(--text);color:var(--white);background:var(--coral);
border-radius:999px;padding:5px 0}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ---------- drawer ---------- */
.shade{position:fixed;inset:0;background:rgba(19,41,75,.28);opacity:0;
pointer-events:none;transition:opacity .2s;z-index:9}
.shade.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);
background:var(--white);z-index:10;transform:translateX(102%);
transition:transform .28s cubic-bezier(.2,.8,.2,1);overflow-y:auto;
box-shadow:-12px 0 40px rgba(19,41,75,.18);
padding:28px 28px calc(40px + env(safe-area-inset-bottom,0px))}
.drawer.on{transform:none}
.close{position:absolute;top:18px;right:18px;width:40px;height:40px;
border-radius:50%;border:0;background:var(--mist);cursor:pointer;
font-size:22px;line-height:1;color:var(--navy)}
.drawer h2{font:800 34px/1 var(--display);color:var(--navy);
margin:6px 48px 4px 0;letter-spacing:-.02em}
.verdict{margin:18px 0 0;padding:14px 16px;border-radius:12px;
background:var(--mist);color:var(--navy);font-weight:700}
.verdict.gap{background:var(--coral-tint);color:var(--coral-ink)}
.drawer h3{font:700 19px/1.2 var(--display);color:var(--navy);margin:28px 0 10px}
.item{padding:12px 0;border-top:1px solid var(--line)}
.item:last-child{border-bottom:1px solid var(--line)}
.row1{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.item b{color:var(--navy)}
.item .meta{font-size:14px;color:var(--slate);margin-top:2px}
.muted{color:var(--slate)}

footer{margin-top:44px;color:var(--slate);font-size:13.5px;max-width:80ch}
footer details{margin-top:8px}
footer summary{cursor:pointer}

@media (max-width:820px){
.page{padding:24px 16px 56px}
.tabs{margin:20px -16px 0;padding:0 16px}
.when{text-align:left}
.li{grid-template-columns:minmax(0,1fr) 20px;gap:6px 12px}
.li>.cell{grid-column:1}
.li.head{display:none}
.chev{grid-row:1/span 4;grid-column:2}
.pm{grid-template-columns:96px minmax(0,1fr)}
.pm .left,.pm .imp{grid-column:2}
.sell summary{grid-template-columns:minmax(0,1fr) 20px}
.sell summary .count{grid-column:1}
.sell summary .chev{grid-row:1/span 2;grid-column:2}
:root{--names:150px}
.cal{overflow-x:auto}
.drawer{top:auto;height:88vh;width:100%;border-radius:18px 18px 0 0;
transform:translateY(102%)}
}
@media (prefers-reduced-motion:reduce){
.bar{animation:none}.drawer,.shade{transition:none}}
.back{display:inline-block;margin-bottom:14px;font-weight:700;
color:var(--navy-2);text-decoration:none;font-size:14.5px}
.back:hover{color:var(--coral-ink)}
.intro{margin:14px 0 22px;max-width:76ch;font-size:15.5px;color:var(--slate)}
.hk.soft{background:var(--coral-tint);color:var(--coral-ink)}
.sortnote{margin:-6px 0 10px;font-size:13px;color:var(--slate)}
.gapword{display:inline-flex;align-items:center;gap:7px;font-weight:700;
color:var(--coral-ink)}
.gapword i{width:8px;height:8px;border-radius:50%;background:var(--coral)}
.small{font-size:13px;color:var(--slate);margin-top:2px}
.act{margin:0;font:700 16px/1.3 var(--display);color:var(--navy)}
details.how,details.others{margin:0 0 20px;font-size:14.5px;color:var(--slate)}
details.others{margin-top:28px}
details.how summary,details.others summary,details.sub2 summary{cursor:pointer;
font-weight:700;color:var(--navy)}
details.how p{max-width:76ch}
details.others .list{margin-top:12px}
.li.li3{grid-template-columns:minmax(0,1.4fr) minmax(0,.7fr) minmax(0,2fr) 20px}
details.sub2{margin:4px 0 16px}
details.sub2 summary{padding:6px;font-size:14px}
.check{display:inline-flex;align-items:center;gap:8px;font-size:14.5px;
cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--navy)}
.warnline{font-size:13px;font-weight:700;color:var(--coral-ink);margin-top:4px}
.pad{padding:0 6px 16px}
.audit{margin:0 0 8px;font-weight:700;color:var(--navy)}
.audit.bad{color:var(--coral-ink)}
.imp-line{font-size:13.5px;color:var(--navy);margin-top:3px}
.unw{margin-top:40px}
.unw h3{font:800 20px/1.2 var(--display);color:var(--navy);margin:0 0 6px}
.li.static{cursor:default}
.li.static:hover{background:none}
.lab{color:var(--navy)}
</style></head><body>
<main class="page">
<a class="back" href="../">← Drug Shortage Tracker</a>
<div class="top">
<h1>Tier 3 Tracker<span class="dot" aria-hidden="true"></span></h1>
<div class="when" id="when"></div>
</div>
<div id="stale"></div>
<p class="intro" id="intro"></p>
<nav class="tabs" role="tablist" aria-label="Views" id="tabs"></nav>
<section class="panel" id="panel" role="tabpanel"></section>
<footer id="foot"></footer>
</main>
<div class="shade" id="shade"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Molecule details">

</aside>

}
function permitList(){
  const list=DATA.permits.filter(p=>{const d=days(p.cutoff);if(d===null)return false;if(ponly&&!p.tracked)return false;return pwin>0?d>=0&&d<=pwin:d<0&&d>=pwin}).sort((a,b)=>pwin>0?(a.cutoff<b.cutoff?-1:1):(a.cutoff<b.cutoff?1:-1));
  $("#pml").innerHTML=list.length?list.map(p=>{const d=days(p.cutoff);
    // One link per molecule name: a permit on apomorphine solution should
    // not show "Apomorphine" twice because the film is tracked too.
    const seen=new Set(),tr=rows.filter(r=>p.tracked&&p.tracked.split(", ").includes(r.name)&&!seen.has(r.name)&&seen.add(r.name));
    const still=tr.some(r=>r.open.some(x=>!x["End date"]||x["End date"]>p.cutoff));
    return '<div class="pm'+(d<0?" gone":d<=DATA.expiring_days?" soon":"")+'"><div class="date"><b>'+esc(fmt(p.cutoff).replace(/, [0-9]{4}$/,""))+'</b><span>'+(d<0?(-d)+" days ago":d===0?"today":d===1?"tomorrow":"in "+d+" days")+'</span></div>'+
    '<div><div class="prod">'+esc(p.product)+'</div><div class="meta">'+esc(importer(p.importer))+', from '+esc((p.origin||"abroad").split(",")[0])+'</div>'+(still?'<div class="warnline">The shortage is still open after this date</div>':"")+'</div>'+
    '<div class="left"><span class="muted">Cleared since</span><br>'+esc(fmt(p.added)||"not given")+'</div>'+
    '<div class="imp">'+(tr.length?tr.map(r=>'<button class="open" data-i="'+r.i+'">'+esc(r.name)+'</button>').join(" "):'<span class="muted">Not a Tier 3 molecule</span>')+'</div></div>'}).join(""):
    '<p class="none">'+(pwin>0?"No permits end in that window.":"No permits ended in the last 30 days.")+'</p>';
}

/* ---------- sellers ---------- */
let sq="";
const MKT='<span class="tag ok">Marketed</span>',APR='<span class="tag dn">Approved, not marketed</span>',DRM='<span class="tag dn">Licence dormant</span>';
const stTag=m=>m.status==="Marketed"?MKT:m.status==="Dormant"?DRM:APR;
// Who supplies it by import right now: the live emergency permits.
const viaImport=r=>{const m={};r.live.forEach(i=>{const k=importer(i.importer);if(!m[k]||i.cutoff>m[k])m[k]=i.cutoff});return Object.keys(m).map(k=>k+" (permit to "+fmt(m[k])+")")};
function sellers(){
  if(!DATA.market_known)return'<p class="none">Health Canada’s Drug Product Database could not be read this week, so this view is empty. It fills in after the next successful update.</p>';
  return '<p class="lede">Who supplies each molecule in the form that is short: companies selling a Canadian-licensed product, and companies importing a foreign one under an emergency permit. Open shortages first, then fewest companies.</p><p class="help">Marketed means the company has told Health Canada it sells the product. It does not mean stock is available: during a shortage it usually is not. A dormant licence is held but the product is not being sold.</p><div class="tools">'+SEARCH.replace("PH","Find a molecule or company")+'</div><div class="sell" id="sl"></div>';
}
function prodRows(list){return'<div class="wrapx"><table class="tbl"><tr><th>Company</th><th>Product</th><th>Strength</th><th>Form</th><th>DIN</th><th>Status</th></tr>'+list.map(m=>'<tr><td>'+esc(nice(m.company))+'</td><td>'+esc(nice(m.brand))+'</td><td>'+esc(m.strength.toLowerCase())+'</td><td>'+esc(nice(m.form))+'</td><td>'+esc(m.din)+'</td><td>'+stTag(m)+'</td></tr>').join("")+'</table></div>'}
function sellerList(){
  const list=rows.filter(r=>!sq||JSON.stringify([r.name,r.market]).toLowerCase().includes(sq)).sort((a,b)=>(b.open.length>0)-(a.open.length>0)||a.sellers.length-b.sellers.length||a.name.localeCompare(b.name));
  $("#sl").innerHTML=list.length?list.map(r=>{const same=r.market.filter(m=>m.form_match),other=r.market.filter(m=>!m.form_match);
    const appr=[...new Set(same.filter(m=>m.status.indexOf("Approved")===0).map(m=>m.company))];const n=r.sellers.length;
    const dorm=[...new Set(same.filter(m=>m.status==="Dormant").map(m=>m.company))],imp=viaImport(r);
    return '<details><summary><div><div class="name">'+esc(r.name)+'</div><div class="sub">'+esc(r.forms)+badge(r)+(r.head?'<span class="tag '+tagOf(r.head.Status)+'">'+word(r.head.Status)+'</span>':"")+'</div></div>'+
    '<div class="count'+(n<=1&&r.open.length?" hot":"")+'">'+(n===0?'<b>No Canadian product</b> is marketed in this form':n===1?'<b>'+esc(nice(r.sellers[0]))+'</b> is the only company marketing a Canadian product':'<b>'+n+' companies</b> market a Canadian product')+(imp.length?'<div class="imp-line">Imported by '+esc(imp.join(", "))+'</div>':n===0?'<div class="small">and no company holds an emergency import permit</div>':"")+(dorm.length?'<div class="small">Licence held but dormant: '+esc(dorm.map(nice).join(", "))+'</div>':"")+(appr.length?'<div class="small">Approved but not marketed yet: '+esc(appr.map(nice).join(", "))+'</div>':"")+'</div><span class="chev" aria-hidden="true"></span></summary>'+
    (same.length?prodRows(same):'<p class="muted pad">No product in this form has a Canadian licence.</p>')+
    (other.length?'<details class="sub2"><summary>Other forms of '+esc(r.name.toLowerCase())+' ('+other.length+')</summary>'+prodRows(other)+'</details>':"")+'</details>'}).join(""):'<p class="none">Nothing matches that.</p>';
}

/* ---------- timeline ---------- */
let months=12;
function timeline(){
  return '<p class="lede">Each molecule on one calendar. Coral is a shortage, blue is an emergency import permit. Coral with nothing under it means Canadian supply only. Each bar ends at its expected date; an arrow means it runs past the edge of the calendar. Click a row for names and dates.</p><div class="tools"><div class="seg" id="range">'+[[6,"6 months ahead"],[12,"1 year ahead"],[24,"2 years ahead"]].map(m=>'<button data-m="'+m[0]+'" aria-pressed="'+(months===m[0])+'">'+m[1]+'</button>').join("")+'</div></div>'+
  '<div class="key" aria-hidden="true"><span><i class="sw" style="background:var(--coral)"></i>Short now</span><span><i class="sw" style="background:repeating-linear-gradient(135deg,var(--coral) 0 6px,#ff8e8a 6px 12px)"></i>Expected</span><span><i class="sw" style="background:var(--navy);height:7px;border-radius:9px"></i>Emergency import permit</span><span><i class="sw" style="background:linear-gradient(90deg,var(--navy) 60%,var(--coral));height:7px;border-radius:9px"></i>Ends within 30 days</span><span><i class="sw" style="border:2px dashed var(--coral);background:none;box-sizing:border-box"></i>No end date given</span></div>'+
  '<div class="cal"><div class="cal-in"><div class="axis"><div class="lbl">Most urgent first</div><div class="ticks" id="ticks"></div></div><div id="lanes"></div></div></div>';
}
let grown=false;
function timelineDraw(){
  const s=new Date(today.getFullYear(),today.getMonth()-3,1),e=new Date(today.getFullYear(),today.getMonth()+months+1,1),span=e-s,pos=d=>Math.min(100,Math.max(0,(d-s)/span*100));
  let t="",g="";const step=months>12?3:1;
  for(let d=new Date(s);d<e;d.setMonth(d.getMonth()+1)){const yr=d.getMonth()===0,p=pos(d);
    if(yr||d.getMonth()%step===0)t+='<span class="tick'+(yr?" yr":"")+'" style="left:'+p+'%">'+(yr?d.getFullYear():d.toLocaleDateString("en-CA",{month:"short"}))+"</span>";
    g+='<i class="'+(yr?"yr":"")+'" style="left:'+p+'%"></i>';}
  $("#ticks").innerHTML=t+'<span class="today" style="left:'+pos(today)+'%"><b>Today</b></span>';
  const day=864e5,plus=(d,n)=>new Date(+d+n*day);
  const dt=d=>d.toLocaleDateString("en-CA",d.getFullYear()===today.getFullYear()?{month:"short",day:"numeric"}:{month:"short",day:"numeric",year:"numeric"});
  // One segment, clipped to the window. "past" marks a bar that runs on
  // beyond the right edge, so it gets an arrow rather than looking endless.
  const seg=(cls,a,b,label,top,an)=>{if(!a||!b||b<s||a>e)return"";let c=cls;if(a<s)c+=" cut";if(b>e)c+=" past";
    const l=pos(a<s?s:a),w=Math.max(pos(b>e?e:b)-l,.6);
    return '<span class="bar '+c+'" title="'+esc(label)+'" style="left:'+l+'%;width:'+w+'%;top:'+top+'px;'+an+'"></span>'};
  // A label where a bar ends, flipped inside the bar near the right edge.
  const lbl=(d,txt,top,cls)=>{if(d<s)return"";const p=d>e?100:pos(d);
    return '<span class="endlbl'+(cls?" "+cls:"")+(p>80?" left":"")+'" style="left:'+p+'%;top:'+top+'px">'+esc(txt)+'</span>'};
  const stale=x=>x.Updated&&-days(x.Updated)>DATA.stale_report_days;
  const list=rows.slice().sort((a,b)=>a.rank-b.rank||a.name.localeCompare(b.name));
  $("#lanes").innerHTML=list.map((r,k)=>{const an=grown?"animation:none":"animation-delay:"+Math.min(k*25,600)+"ms";
    let b="";
    // Closed reports: grey, start to end.
    r.reps.filter(x=>!OPEN.includes(x.Status)).forEach(x=>{b+=seg("dn",D(x["Start date"]),D(x["End date"]),nice(x.Company)+": "+word(x.Status),16,an)});
    // The open shortage as one bar, from its earliest start to the date in
    // the headline, so every bar visibly ends: at the expected return
    // date, at an arrow past the edge, or in a dashed stub marked
    // "no end date". It used to fade into the edge and read as endless.
    if(r.head){
      const use=r.open.filter(x=>!stale(x)).length?r.open.filter(x=>!stale(x)):r.open;
      const st=use.map(x=>D(x["Start date"])).filter(Boolean).sort((a,b)=>a-b)[0]||today;
      const cls=r.head.Status==="Actual shortage"?"sh":"ex",en=D(r.end),who=word(r.head.Status);
      const disc=r.head.Status==="To be discontinued";
      if(en&&en>=today){b+=seg(cls,st,en,who+" until "+fmt(r.end),16,an)+lbl(en,(en>e?"back "+dt(en)+" →":"back "+dt(en)),14,"");}
      else if(en){b+=seg(cls,st,en,who,16,an)+seg(cls+" tail",en,today,"Still open after the expected date",16,an)+lbl(today,"still open, was due "+dt(en),14,"");}
      else{const from=st>today?st:today,stub=plus(from,45);
        b+=(st<from?seg(cls,st,from,who,16,an):"")+seg(cls+" tail",from,stub,"No end date given",16,an)+lbl(stub,disc?"discontinued from "+dt(st):"no end date given",14,"");}
    }
    // Import permits: each ends at its cutoff, labelled while still live.
    r.imports.forEach((i,j)=>{const top=40+(j%2)*12,a=D(i.added),z=D(i.cutoff);
      b+=seg("im"+(i.state==="Expiring"?" soon":i.state==="Expired"?" old":""),a,z,importer(i.importer)+" import permit until "+(fmt(i.cutoff)||"no date"),top,an);
      if(z&&i.state!=="Expired")b+=lbl(z,"permit to "+dt(z)+(z>e?" →":""),top-3,"im");});
    return '<button class="lane" data-i="'+r.i+'"><div class="who"><div class="name">'+esc(r.name)+'</div><div class="sub">'+esc(r.forms)+badge(r)+'</div></div><div class="track"><div class="grid">'+g+'</div>'+b+'<span class="today" style="left:'+pos(today)+'%"></span></div></button>'}).join("");
  grown=true;
}

/* ---------- render ---------- */
function render(focus){
  drawTabs();
  const P={overview,suggestions,permits,sellers,timeline}[tab];
  $("#panel").innerHTML=P();
  if(tab==="overview")overviewList();
  if(tab==="permits")permitList();
  if(tab==="sellers")sellerList();
  if(tab==="timeline")timelineDraw();
  const qi=$("#q");if(qi){qi.value=tab==="sellers"?sq:q;qi.addEventListener("input",()=>{if(tab==="sellers"){sq=qi.value.trim().toLowerCase();sellerList()}else{q=qi.value.trim().toLowerCase();overviewList()}})}
  const po=$("#ponly");if(po)po.addEventListener("change",()=>{ponly=po.checked;permitList()});
  if(focus)$("#t-"+tab).focus();
}
function go(t,focus){tab=t;history.replaceState(null,"","#"+t);render(focus);window.scrollTo({top:0})}

/* ---------- drawer ---------- */
let openRow=null,lastFocus=null;
function repItem(x){return'<div class="item"><div class="row1"><b>'+esc(nice(x.Company))+'</b><span class="tag '+tagOf(x.Status)+'">'+esc(word(x.Status))+'</span></div><div class="meta">'+esc(nice(x["Brand name"]))+(x.Strength?", "+esc(x.Strength.toLowerCase()):"")+(x["Form match"]==="Yes"?"":", "+esc(x["Dosage form"]))+'<br>'+(x["Start date"]?esc(fmt(x["Start date"]))+(x["End date"]?" to "+esc(fmt(x["End date"])):", no end date given"):"No dates given")+(x["Tier 3"]==="Yes"?". Health Canada rates it Tier 3":"")+(OPEN.includes(x.Status)&&x["End date"]&&days(x["End date"])<0?'<br><span class="warnline">Past its expected end date, but '+esc(nice(x.Company))+' has not closed the report</span>':"")+'<br>Health Canada report '+esc(x["Report ID"])+(x.Updated?", last updated "+esc(fmt(x.Updated)):"")+'</div></div>'}
function sellItem(m){return'<div class="item"><div class="row1"><b>'+esc(nice(m.company))+'</b>'+stTag(m)+'</div><div class="meta">'+esc(nice(m.brand))+', '+esc(m.strength.toLowerCase())+', '+esc(nice(m.form))+'<br>DIN '+esc(m.din)+'</div></div>'}
function show(i){
  const r=byI[i];if(!r)return;openRow=i;lastFocus=document.activeElement;
  const cur=r.reports.filter(x=>x["Form match"]==="Yes"&&OPEN.includes(x.Status)),past=r.reports.filter(x=>!cur.includes(x));
  const same=r.market.filter(m=>m.form_match),other=r.market.filter(m=>!m.form_match);
  let h='<p class="muted" style="margin:0">'+esc(r.forms)+'</p><h2>'+esc(r.name)+'</h2><p class="verdict '+(r.kind==="gap"?"gap":"")+'">'+esc(r.say)+'.</p>';
  if(r.reasons.length)h+='<h3>Suggestion: '+esc(r.action)+'</h3><p class="muted" style="margin:-4px 0 8px">'+r.score+' of '+DATA.max_points+' points</p><ul class="why">'+r.reasons.map(x=>'<li'+(x.indexOf("Hikma")===0?' class="mine"':"")+'>'+esc(x)+'</li>').join("")+'</ul>';
  h+='<h3>Hikma</h3><p style="margin:0"><b class="lab">Hikma US:</b> '+(r.us?esc(r.hikma_us)+(r.hikma_form?' <span class="muted">(not the same product: Hikma’s is '+esc(r.hikma_form)+')</span>':""):'<span class="muted">no matching product</span>')+'<br><b class="lab">Hikma Canada:</b> '+caText(r)+'</p>';
  h+='<h3>Shortage reports</h3>'+(cur.length?cur.map(repItem).join(""):'<p class="muted">No open shortage in this form.</p>')+
    (past.length?'<details class="sub2"><summary>Resolved, older or other-form reports ('+past.length+')</summary>'+past.map(repItem).join("")+'</details>':"");
  h+='<h3>Emergency import permits</h3>'+(r.imports.length?r.imports.map(i=>'<div class="item"><div class="row1"><b>'+esc(importer(i.importer))+'</b><span class="tag '+(i.state==="Active"?"ok":i.state==="Expiring"?"ex":"dn")+'">'+esc(i.state==="Expiring"?"Ends within 30 days":i.state)+'</span></div><div class="meta">'+esc(i.product)+'<br>From '+esc((i.origin||"abroad").split(",")[0])+', '+esc(fmt(i.added))+' to '+esc(fmt(i.cutoff)||i.cutoff_raw||"no end date")+'</div></div>').join(""):'<p class="muted">No company has an emergency permit to import this, so the Canadian supply is the only supply.</p>');
  h+='<h3>Canadian licence holders</h3>'+(!DATA.market_known?'<p class="muted">Not loaded this week.</p>':(same.length?same.map(sellItem).join(""):'<p class="muted">No product in this form has a Canadian licence.</p>')+
    (other.length?'<details class="sub2"><summary>Other forms ('+other.length+')</summary>'+other.map(sellItem).join("")+'</details>':""));
  if(r.changed)h+='<h3>Changed since last week</h3><p>'+esc(r.changed)+'</p>';
  $("#dbody").innerHTML=h;$("#drawer").classList.add("on");$("#drawer").setAttribute("aria-hidden","false");$("#shade").classList.add("on");$("#close").focus();
}
function caText(r){
  const L=r.hikma_ca_lines||[],same=L.filter(x=>x.form_match);
  const list=a=>esc(a.map(x=>x.raw+(x.stage==="launch"?" (launch)":"")).join("; "));
  if(r.ca==="marketed")return"markets it in this form: "+list(same);
  if(r.ca==="launch")return"launching it in this form: "+list(same);
  if(r.ca==="other")return"has it in another form only: "+list(L);
  return'<span class="muted">not in the Hikma Canada portfolio</span>';
}
function hide(){$("#drawer").classList.remove("on");$("#drawer").setAttribute("aria-hidden","true");$("#shade").classList.remove("on");openRow=null;if(lastFocus)lastFocus.focus()}

/* ---------- wiring ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab]");if(t){go(t.dataset.tab);return}
  const o=e.target.closest("[data-ovf]");if(o){ovf=o.dataset.ovf;document.querySelectorAll("[data-ovf]").forEach(b=>b.setAttribute("aria-pressed",b===o));overviewList();return}
  const w=e.target.closest("[data-pw]");if(w){pwin=+w.dataset.pw;document.querySelectorAll("[data-pw]").forEach(b=>b.setAttribute("aria-pressed",b===w));permitList();return}
  const m=e.target.closest("[data-m]");if(m){months=+m.dataset.m;document.querySelectorAll("[data-m]").forEach(b=>b.setAttribute("aria-pressed",b===m));timelineDraw();return}
  const i=e.target.closest("[data-i]");if(i){show(+i.dataset.i);return}
  if(e.target.closest("#close")||e.target.id==="shade")hide();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&openRow!==null){hide();return}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".idea[data-i]")){e.preventDefault();show(+e.target.dataset.i);return}
  if(e.target.matches&&e.target.matches(".tab")&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){
    const k=TABS.findIndex(t=>t[0]===tab),n=(k+(e.key==="ArrowRight"?1:TABS.length-1))%TABS.length;go(TABS[n][0],true)}
});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)&&h!==tab){tab=h;render()}});
render();

$("#foot").innerHTML="Shortage reports: Health Product Shortages Canada ("+Number(DATA.scanned).toLocaleString("en-CA")+" reports checked). Import permits: Health Canada’s List of Drugs for Exceptional Importation and Sale ("+DATA.import_rows+" entries). Sellers: Health Canada’s Drug Product Database. Hikma US products: Hikma’s US catalog and the FDA NDC Directory. Hikma Canada products: the Hikma Canada portfolio used by the shortage tools. Rebuilt every Monday."+
  (DATA.warnings.length?"<details><summary>Data notes ("+DATA.warnings.length+")</summary><ul>"+DATA.warnings.map(w=>"<li>"+esc(w)+"</li>").join("")+"</ul></details>":"");
// The weekly source check writes audit.json beside the page. Shown so a
// reader can see the page was last verified, and when.
fetch("audit.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(a=>{if(!a||!a.date)return;
  const p=document.createElement("p");p.className="audit"+(a.problems?" bad":"");
  p.textContent="Last checked line by line against Health Canada’s sources on "+fmt(a.date)+": "+(a.problems?a.problems+(a.problems===1?" line did":" lines did")+" not match and "+(a.problems===1?"is":"are")+" being fixed.":"every line matched.");
  $("#foot").prepend(p)}).catch(()=>{});
})();
</script></body></html>
