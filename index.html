<style>
:root{--bg:#f6f8f7;--card:#fff;--fg:#17211e;--muted:#5d6b66;--line:#dbe3e0;

--warn:#9a6200;--warn-s:#fbf0d9;--bad:#b42318;--bad-s:#fbe6e3;--off:#6f7d78;
--off-s:#eef1f0;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1513;--card:#161e1b;
--fg:#e4ebe8;--muted:#97a6a0;--line:#2a3632;--soft:#1c2623;--acc:#5cc4ae;
--acc-s:#16312b;--ok:#6fd39a;--ok-s:#163223;--warn:#f0bd5c;--warn-s:#352914;
--bad:#ff8a7d;--bad-s:#3a1c19;--off:#8a9893;--off-s:#1e2724;
color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);
font:15px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:24px 16px 56px;display:grid;
gap:18px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;
align-items:flex-end;gap:10px}
h1{margin:0;font-size:26px}
.sub{margin:4px 0 0;color:var(--muted);max-width:70ch}
.stamp{font:12.5px Consolas,ui-monospace,monospace;color:var(--muted);
text-align:right}
.banner{padding:10px 14px;border-radius:8px;background:var(--bad-s);
color:var(--bad);font-weight:600}
.banner.warn{background:var(--warn-s);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;
padding:11px 13px;text-align:left;font:inherit;color:inherit;cursor:pointer;
display:grid;gap:2px}
.stat:hover,.stat[aria-pressed=true]{border-color:var(--acc)}
.stat[aria-pressed=true]{box-shadow:inset 0 0 0 1px var(--acc)}
.stat b{font-size:23px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;
color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar input,.bar select{padding:8px 10px;border:1px solid var(--line);
border-radius:6px;background:var(--card);color:var(--fg);font:inherit}
.bar input{flex:1 1 240px;min-width:0}
.count{color:var(--muted);font-size:13px}
.box{overflow-x:auto;background:var(--card);border:1px solid var(--line);
border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:900px}
th{position:sticky;top:0;background:var(--soft);text-align:left;
font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
color:var(--muted);padding:9px 11px;border-bottom:1px solid var(--line);
white-space:nowrap}
td{padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}tr.row:hover td{background:var(--soft)}
tr.row:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.mol{font-weight:600}.dim{color:var(--muted);font-size:13px}
.mono{font-family:Consolas,ui-monospace,monospace;font-size:12.5px;
font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;
border-radius:999px;margin:0 4px 4px 0;white-space:nowrap}
.ok{background:var(--ok-s);color:var(--ok)}
.warn{background:var(--warn-s);color:var(--warn)}
.bad{background:var(--bad-s);color:var(--bad)}
.off{background:var(--off-s);color:var(--off)}
.acc{background:var(--acc-s);color:var(--acc)}
tr.detail td{background:var(--soft);padding:14px 16px}
.detail h3{margin:12px 0 6px;font-size:12px;text-transform:uppercase;
letter-spacing:.05em;color:var(--muted)}
.detail h3:first-child{margin-top:0}
.inner{min-width:0;width:100%;border-collapse:collapse}
.inner td,.inner th{position:static;background:none;padding:5px 8px;
font-size:13px}
.changes{background:var(--card);border:1px solid var(--line);
border-radius:8px;padding:12px 16px}
.changes h2{margin:0 0 6px;font-size:15px}
.changes ul{margin:0;padding-left:18px}
footer{color:var(--muted);font-size:12.5px}
.notes{color:var(--muted);font-size:12.5px}
.notes summary{cursor:pointer}
.notes ul{margin:6px 0 0;padding-left:18px}
