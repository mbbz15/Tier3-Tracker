<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Tier 3 Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* The page is a supply calendar. Every Tier 3 molecule is a lane on one
   shared time axis: coral bars are shortages, blue bars are import
   permits, the coral line is today. A gap is coral with no blue under it,
   and you can see it without reading a word. Hikma coral and blue on
   white; Bricolage Grotesque for names and headings, Atkinson Hyperlegible
   (drawn for low-vision readers) for everything you read. Light only. */
:root{
--white:#ffffff;--navy:#13294b;--navy-2:#2b4475;--mist:#eef2f8;
--line:#e4e9f1;--coral:#ff5c57;--coral-ink:#c4302b;--coral-tint:#ffe9e8;
--ink:#17213a;--slate:#5b6880;--fog:#cbd3df;
--display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
--text:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
--names:290px;color-scheme:light}
*{box-sizing:border-box}
html{background:var(--white)}
body{margin:0;background:var(--white);color:var(--ink);
font:16px/1.55 var(--text);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.page{max-width:1280px;margin:0 auto;padding:40px 28px 72px}

/* ---------- top ---------- */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;
align-items:start}
h1{font:800 clamp(40px,6vw,72px)/.95 var(--display);margin:0;
letter-spacing:-.03em;color:var(--navy);font-variation-settings:"opsz" 96}
h1 .dot{display:inline-block;width:.22em;height:.22em;border-radius:50%;
background:var(--coral);margin-left:.06em;vertical-align:.08em}
.when{text-align:right;color:var(--slate);font-size:14px;line-height:1.5}
.when b{color:var(--navy);font-weight:700}
.story{margin:22px 0 0;max-width:58ch;font-size:clamp(18px,2.1vw,22px);
line-height:1.5;color:var(--ink)}
.story .f{padding:0 .12em;cursor:pointer;-webkit-box-decoration-break:clone;
box-decoration-break:clone;
font-weight:700;color:var(--navy);
background-image:linear-gradient(var(--mist),var(--mist));
background-size:100% 42%;background-position:0 88%;background-repeat:no-repeat;
transition:background-size .2s,color .2s;border-radius:2px}
.story .f:hover{background-size:100% 100%}
.story .f.gap{color:var(--coral-ink);
background-image:linear-gradient(var(--coral-tint),var(--coral-tint))}
.story .f[aria-pressed=true]{color:var(--white);background-size:100% 100%;
background-image:linear-gradient(var(--navy),var(--navy))}
.story .f.gap[aria-pressed=true]{
background-image:linear-gradient(var(--coral-ink),var(--coral-ink))}
.story .f:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.story .reset{font-weight:400;color:var(--slate);background-image:none;
text-decoration:underline;text-underline-offset:3px;font-size:.8em}
.stale{margin:24px 0 0;padding:14px 18px;border-radius:10px;
background:var(--coral-tint);color:var(--coral-ink);font-weight:700}
.week{margin:18px 0 0;font-size:15px;color:var(--slate)}
.week summary{cursor:pointer;color:var(--navy);font-weight:700}
.week ul{margin:8px 0 0;padding-left:20px;max-width:80ch}

/* ---------- controls ---------- */
.controls{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:end;
margin:44px 0 14px}
.find{flex:1 1 280px;min-width:0;display:flex;align-items:center;gap:10px;
border-bottom:2px solid var(--navy);padding:4px 2px 8px}
.find svg{flex:none;color:var(--navy)}
.find input{border:0;outline:0;background:none;width:100%;font-size:18px}
.find input::placeholder{color:var(--slate)}
.find:focus-within{border-color:var(--coral)}
.seg{display:inline-flex;background:var(--mist);border-radius:999px;padding:4px}
.seg button{border:0;background:none;border-radius:999px;padding:7px 14px;
cursor:pointer;font-size:14px;color:var(--navy-2)}
.seg button[aria-pressed=true]{background:var(--white);color:var(--navy);
font-weight:700;box-shadow:0 1px 3px rgba(19,41,75,.18)}
.seg-label{font-size:13px;color:var(--slate);margin:0 0 6px}
.key{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:13.5px;
color:var(--slate);margin:0 0 10px}
.key span{display:inline-flex;align-items:center;gap:8px}
.sw{display:inline-block;width:26px;height:10px;border-radius:3px}

/* ---------- the calendar ---------- */
.cal{position:relative;border-top:2px solid var(--navy)}
.axis,.lane{display:grid;grid-template-columns:var(--names) minmax(0,1fr)}
.axis{position:sticky;top:0;z-index:3;background:var(--white);
border-bottom:1px solid var(--line)}
.axis .lbl{font-size:13px;color:var(--slate);padding:10px 0 8px}
.ticks{position:relative;height:40px}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);
padding:10px 0 0 6px;font-size:12.5px;color:var(--slate);white-space:nowrap}
.tick.yr{border-left:2px solid var(--navy-2);color:var(--navy);
font-weight:700}
.lanes{position:relative}
.lane{width:100%;text-align:left;border:0;background:none;padding:0;
cursor:pointer;border-bottom:1px solid var(--line);display:grid}
.lane:hover,.lane:focus-visible{background:#f8fafd;outline:0}
.lane:focus-visible .who{box-shadow:inset 3px 0 0 var(--coral)}
.lane.on{background:var(--mist)}
.who{padding:14px 16px 14px 0;min-width:0}
.name{font:700 18px/1.2 var(--display);color:var(--navy);
display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.line2{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:3px}
.form{font-weight:500;font-size:14px;color:var(--slate);
font-family:var(--text)}
.hk{font:700 11.5px/1 var(--text);color:var(--white);background:var(--coral);
border-radius:999px;padding:4px 8px}
.say{margin-top:4px;font-size:14px;line-height:1.35;color:var(--slate)}
.say.gap{color:var(--coral-ink);font-weight:700}
.say.cov{color:var(--navy-2)}
.track{position:relative;min-height:74px}
.grid{position:absolute;inset:0;pointer-events:none}
.grid i{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.grid i.yr{border-left:1px solid var(--fog)}
.bar{position:absolute;height:16px;border-radius:5px;
transform-origin:left center;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.bar.sh{top:18px;background:var(--coral)}
.bar.ex{top:18px;background:repeating-linear-gradient(135deg,var(--coral) 0 6px,
#ff8e8a 6px 12px)}
.bar.dn{top:18px;background:var(--fog)}
.bar.open{border-top-right-radius:0;border-bottom-right-radius:0;
-webkit-mask-image:linear-gradient(90deg,#000 80%,transparent);
mask-image:linear-gradient(90deg,#000 80%,transparent)}
.bar.cut{border-top-left-radius:0;border-bottom-left-radius:0}
.bar.im{height:9px;background:var(--navy);border-radius:999px}
.bar.im.soon{background:linear-gradient(90deg,var(--navy) 70%,var(--coral))}
.bar.im.old{background:var(--fog)}
.today{position:absolute;top:0;bottom:0;width:0;
border-left:2px solid var(--coral);z-index:2;pointer-events:none}
.today b{position:absolute;bottom:-11px;left:-24px;width:48px;text-align:center;
font:700 12px/1 var(--text);color:var(--white);background:var(--coral);
border-radius:999px;padding:5px 0}
.none{padding:48px 0;color:var(--slate);font-size:18px}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ---------- drawer ---------- */
.shade{position:fixed;inset:0;background:rgba(19,41,75,.28);opacity:0;
pointer-events:none;transition:opacity .2s;z-index:9}
.shade.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);
background:var(--white);z-index:10;transform:translateX(102%);
transition:transform .28s cubic-bezier(.2,.8,.2,1);overflow-y:auto;
box-shadow:-12px 0 40px rgba(19,41,75,.18);
padding:28px 28px calc(40px + env(safe-area-inset-bottom,0px))}
.drawer.on{transform:none}
.close{position:absolute;top:18px;right:18px;width:40px;height:40px;
border-radius:50%;border:0;background:var(--mist);cursor:pointer;
font-size:22px;line-height:1;color:var(--navy)}
.drawer h2{font:800 34px/1 var(--display);color:var(--navy);margin:6px 48px 4px 0;
letter-spacing:-.02em}
.drawer .form{font-size:15px}
.verdict{margin:18px 0 0;padding:14px 16px;border-radius:12px;
background:var(--mist);color:var(--navy);font-weight:700}
.verdict.gap{background:var(--coral-tint);color:var(--coral-ink)}
.drawer h3{font:700 19px/1.2 var(--display);color:var(--navy);
margin:28px 0 10px}
.item{padding:12px 0;border-top:1px solid var(--line)}
.item:last-child{border-bottom:1px solid var(--line)}
.item .row1{display:flex;justify-content:space-between;gap:12px;
align-items:baseline}
.item b{color:var(--navy)}
.item .meta{font-size:14px;color:var(--slate);margin-top:2px}
.tag{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;
padding:3px 9px;white-space:nowrap}
.tag.sh{background:var(--coral);color:var(--white)}
.tag.ex{background:var(--coral-tint);color:var(--coral-ink)}
.tag.ok{background:var(--navy);color:var(--white)}
.tag.dn{background:var(--mist);color:var(--slate)}
.hikma{margin:0;font-size:15.5px}
.muted{color:var(--slate)}

/* ---------- foot ---------- */
footer{margin-top:40px;color:var(--slate);font-size:13.5px;max-width:80ch}
footer details{margin-top:8px}
footer summary{cursor:pointer}

@media (max-width:760px){
:root{--names:150px}
.page{padding:28px 16px 56px}
.top{grid-template-columns:1fr}
.when{text-align:left}
.name{font-size:16px}
.say{display:none}
.cal{overflow-x:auto}
.axis,.lane{min-width:720px}
.drawer{top:auto;height:86vh;width:100%;border-radius:18px 18px 0 0;
transform:translateY(102%)}
}
@media (prefers-reduced-motion:reduce){
.bar{animation:none}.drawer,.shade,.story button{transition:none}}
</style></head><body>
<main class="page">
<div class="top">
<h1>Tier 3 Tracker<span class="dot" aria-hidden="true"></span></h1>
<div class="when" id="when"></div>
</div>
<p class="story" id="story"></p>
<div id="stale"></div>
<details class="week" id="week" hidden></details>

<div class="controls">
<label class="find"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"
stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>
</svg><input id="q" type="search" autocomplete="off"
placeholder="Find a molecule, company or importer" aria-label="Find"></label>
<div><p class="seg-label">Show</p><div class="seg" id="range" role="group"
aria-label="Time range"><button data-m="6">6 months ahead</button><button
data-m="12">1 year ahead</button><button data-m="24">2 years ahead</button>
</div></div>
<div><p class="seg-label">Order</p><div class="seg" id="sort" role="group"
aria-label="Order"><button data-s="need">Most urgent</button><button
data-s="az">A to Z</button></div></div>
</div>

<div class="key" aria-hidden="true">
<span><i class="sw" style="background:var(--coral)"></i>Shortage</span>
<span><i class="sw" style="background:repeating-linear-gradient(135deg,var(--coral) 0 6px,#ff8e8a 6px 12px)"></i>Expected shortage</span>
<span><i class="sw" style="background:var(--navy);height:7px;border-radius:9px"></i>Import permit</span>
<span><i class="sw" style="background:linear-gradient(90deg,var(--navy) 60%,var(--coral));height:7px;border-radius:9px"></i>Permit ending within 30 days</span>
<span><i class="sw" style="background:var(--coral);width:3px;height:16px"></i>Today</span>
</div>

<section class="cal" aria-label="Supply calendar">
<div class="axis"><div class="lbl" id="count"></div><div class="ticks" id="ticks"></div></div>
<div class="lanes" id="lanes"></div>
</section>

<footer id="foot"></footer>
</main>
<div class="shade" id="shade"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Molecule details">
<button class="close" id="close" aria-label="Close">&times;</button>
<div id="dbody"></div>
</aside>

rigin": "United States, Food and Drug Administration, National Drug Code (NDC): 0187-5600-15", "added": "2026-09-25", "cutoff": "2026-12-31", "cutoff_raw": "December 31, 2026", "state": "Active", "unsure": false}]}], "warnings": [], "changes": ["Aminophylline (solution): report 284545 changed, end 2026-10-19 to 2026-10-29"], "first_run": false, "scanned": 9400, "import_rows": 165, "stale_days": 8, "show_notes": false};
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const D=s=>s?new Date(s+"T00:00:00"):null;
const fmt=s=>{const d=D(s);return d&&!isNaN(d)?d.toLocaleDateString("en-CA",{month:"short",day:"numeric",year:"numeric"}):"";};
const mon=d=>d.toLocaleDateString("en-CA",{month:"short",year:"numeric"});
const today=new Date();today.setHours(0,0,0,0);
// Health Canada sends company names in capitals; show them as names.
const nice=s=>String(s||"").toLowerCase().replace(/(^|[ (.&,-])([a-z])/g,(m,a,b)=>a+b.toUpperCase());
const OPEN=["Actual shortage","Anticipated shortage","To be discontinued"];

const rows=DATA.rows.map(r=>{
  const reps=r.reports.filter(x=>x["Form match"]==="Yes");
  const open=reps.filter(x=>OPEN.includes(x.Status));
  const live=r.imports.filter(i=>i.state==="Active"||i.state==="Expiring")
    .sort((a,b)=>a.cutoff<b.cutoff?-1:1);
  const actual=open.some(x=>x.Status==="Actual shortage");
  const hk=!!r.hikma_us;
  let kind,say;
  if(open.length&&!live.length){kind="gap";
    say=(actual?"Short now":"Shortage expected")+", nobody cleared to import";}
  else if(open.length){kind="cov";
    say="Covered by "+nice(live[0].importer)+" until "+mon(D(live[0].cutoff));}
  else if(live.length){kind="cov";
    say="No open shortage. "+nice(live[0].importer)+" can import until "+mon(D(live[0].cutoff));}
  else{kind="none";say="No open shortage on file";}
  const soon=r.imports.some(i=>i.state==="Expiring");
  const rank=(kind==="gap"?0:kind==="cov"&&open.length?2:kind==="cov"?3:4)-(hk&&kind==="gap"?1:0)-(soon?.5:0);
  return Object.assign({},r,{reps,open,live,kind,say,hk,soon,actual,rank});
});

let months=12,order="need",pick=null,openRow=null,first=true;

/* ---- top ---- */
$("#when").innerHTML="Updated <b>"+esc(fmt(DATA.run_date))+"</b><br>Health Canada import list<br>issued <b>"+esc(fmt(DATA.issued)||"unknown")+"</b>";
const F={
  short:r=>r.open.length>0,
  gap:r=>r.kind==="gap",
  hgap:r=>r.hk&&r.kind==="gap",
  soon:r=>r.soon,
  hikma:r=>r.hk};
function n(k){return rows.filter(F[k]).length}
// Inline spans rather than buttons, so a phrase wraps like the sentence it
// is part of. Keyboard users reach them with Tab and press Enter.
function chip(k,txt,cls){return '<span role="button" tabindex="0" data-f="'+k+'" class="f '+(cls||"")+'" aria-pressed="'+(pick===k)+'">'+txt+'</span>'}
function story(){
  const s=n("short"),g=n("gap"),hg=n("hgap"),so=n("soon"),hk=n("hikma");
  $("#story").innerHTML="Of the "+rows.length+" entries on Health Canada’s Tier 3 list, "+
    chip("short",s+" are short or about to be")+". "+
    chip("gap",g+" have nobody cleared to import","gap")+
    (hg?", including "+chip("hgap",hg+" that Hikma makes","gap"):"")+". "+
    "Hikma makes "+chip("hikma",hk+" of the "+rows.length)+
    (so?", and "+chip("soon",so+" import permits run out within 30 days")+".":".")+
    (pick?' <span role="button" tabindex="0" class="f reset" data-f="">Show everything</span>':"");
}
const age=Math.floor((today-D(DATA.run_date))/864e5);
if(age>DATA.stale_days)$("#stale").innerHTML='<p class="stale">This tracker last updated '+esc(fmt(DATA.run_date))+', '+age+' days ago. The weekly update may have failed, so treat it as out of date.</p>';
if(!DATA.first_run){const w=$("#week");w.hidden=false;
  w.innerHTML=DATA.changes.length?"<summary>What changed since last week ("+DATA.changes.length+")</summary><ul>"+DATA.changes.map(c=>"<li>"+esc(c)+"</li>").join("")+"</ul>":"<summary>Nothing changed since last week</summary>";}

/* ---- axis ---- */
function windowOf(){const s=new Date(today.getFullYear(),today.getMonth()-3,1);
  const e=new Date(today.getFullYear(),today.getMonth()+months+1,1);return[s,e];}
function axis(){
  const[s,e]=windowOf(),span=e-s,pos=d=>(d-s)/span*100;let t="",g="";
  const step=months>12?3:1;
  for(let d=new Date(s);d<e;d.setMonth(d.getMonth()+1)){
    const yr=d.getMonth()===0,p=pos(d);
    if(yr||d.getMonth()%step===0)t+='<span class="tick'+(yr?" yr":"")+'" style="left:'+p+'%">'+(yr?d.getFullYear():d.toLocaleDateString("en-CA",{month:"short"}))+"</span>";
    g+='<i class="'+(yr?"yr":"")+'" style="left:'+p+'%"></i>';
  }
  $("#ticks").innerHTML=t+'<span class="today" style="left:'+pos(today)+'%"><b>Today</b></span>';
  return{s,e,pos,g};
}

/* ---- lanes ---- */
function bar(cls,a,b,ax,label,extra){
  let st=D(a)||ax.s,en=D(b),open=!en;if(!en)en=ax.e;
  if(en<ax.s||st>ax.e)return"";
  let c=cls;if(st<ax.s){st=ax.s;c+=" cut"}if(en>ax.e){en=ax.e;c+=" open"}if(open)c+=" open";
  const l=ax.pos(st),w=Math.max(ax.pos(en)-l,.6);
  return '<span class="bar '+c+'" title="'+esc(label)+'" style="left:'+l+'%;width:'+w+'%;'+(extra||"")+'"></span>';
}
function render(){
  story();const ax=axis(),q=$("#q").value.trim().toLowerCase();
  let list=rows.filter(r=>(!pick||F[pick](r))&&(!q||JSON.stringify(r).toLowerCase().includes(q)));
  list.sort(order==="az"?(a,b)=>a.name.localeCompare(b.name):(a,b)=>a.rank-b.rank||a.name.localeCompare(b.name));
  $("#count").textContent=list.length+" of "+rows.length+" shown";
  if(!list.length){$("#lanes").innerHTML='<p class="none">Nothing matches that. Clear the search or choose Show everything.</p>';return}
  $("#lanes").innerHTML=list.map((r,k)=>{
    // Bars grow in once, lane by lane, on first load only.
    const d=first?"animation-delay:"+Math.min(k*25,600)+"ms":"animation:none";
    let b=r.reps.map(x=>{const cls=x.Status==="Actual shortage"?"sh":OPEN.includes(x.Status)?"ex":"dn";
      return bar(cls,x["Start date"],x["End date"],ax,nice(x.Company)+": "+x.Status+" "+fmt(x["Start date"])+(x["End date"]?" to "+fmt(x["End date"]):", no end date"),d)}).join("");
    b+=r.imports.map((i,j)=>{const cls="im"+(i.state==="Expiring"?" soon":i.state==="Expired"?" old":"");
      return bar(cls,i.added,i.cutoff,ax,nice(i.importer)+" can import "+fmt(i.added)+" to "+(fmt(i.cutoff)||"no date"),"top:"+(44+(j%2)*13)+"px;"+d)}).join("");
    return '<button class="lane'+(openRow===r.i?" on":"")+'" data-i="'+r.i+'"><div class="who"><div class="name">'+esc(r.name)+'</div><div class="line2"><span class="form">'+esc(r.forms)+'</span>'+
      (r.hk?'<span class="hk" title="Hikma makes this">Hikma makes it</span>':"")+'</div><div class="say '+r.kind+'">'+esc(r.say)+'</div></div><div class="track"><div class="grid">'+ax.g+'</div>'+b+
      '<span class="today" style="left:'+ax.pos(today)+'%"></span></div></button>';
  }).join("");
  first=false;
}

/* ---- drawer ---- */
function tagOf(s){return s==="Actual shortage"?"sh":OPEN.includes(s)?"ex":"dn"}
function show(i){
  const r=rows.find(x=>x.i===i);if(!r)return;openRow=i;
  let h='<p class="form">'+esc(r.forms)+'</p><h2>'+esc(r.name)+'</h2>'+
    '<p class="verdict '+(r.kind==="gap"?"gap":"")+'">'+esc(r.say)+'.</p>';
  h+='<h3>Hikma</h3><p class="hikma">'+(r.hk?esc(r.hikma_us):'<span class="muted">Not in Hikma’s US injectables catalog.</span>')+
    (r.hikma_ca==="Yes"?'<br><span class="muted">Also in the Hikma Canada portfolio.</span>':"")+'</p>';
  h+='<h3>Shortage reports</h3>'+(r.reports.length?r.reports.map(x=>'<div class="item"><div class="row1"><b>'+esc(nice(x.Company))+'</b><span class="tag '+tagOf(x.Status)+'">'+esc(x.Status)+'</span></div><div class="meta">'+
    esc(nice(x["Brand name"]))+(x.Strength?", "+esc(x.Strength.toLowerCase()):"")+(x["Form match"]==="Yes"?"":", "+esc(x["Dosage form"])+" (other form)")+'<br>'+
    (x["Start date"]?esc(fmt(x["Start date"]))+(x["End date"]?" to "+esc(fmt(x["End date"])):", no end date given"):"No dates given")+
    (x["Tier 3"]==="Yes"?", Tier 3":"")+'<br>Health Canada report '+esc(x["Report ID"])+'</div></div>').join(""):'<p class="muted">None in the last two years.</p>');
  h+='<h3>Import permits</h3>'+(r.imports.length?r.imports.map(i=>'<div class="item"><div class="row1"><b>'+esc(nice(i.importer))+'</b><span class="tag '+(i.state==="Active"?"ok":i.state==="Expiring"?"ex":"dn")+'">'+
    esc(i.state==="Expiring"?"Ends soon":i.state)+'</span></div><div class="meta">'+esc(i.product)+'<br>From '+esc((i.origin||"abroad").split(",")[0])+', '+esc(fmt(i.added))+' to '+esc(fmt(i.cutoff)||i.cutoff_raw||"no end date")+'</div></div>').join(""):'<p class="muted">Nobody has been cleared to import this.</p>');
  if(r.changed)h+='<h3>Changed since last week</h3><p>'+esc(r.changed)+'</p>';
  $("#dbody").innerHTML=h;$("#drawer").classList.add("on");$("#drawer").setAttribute("aria-hidden","false");
  $("#shade").classList.add("on");document.querySelectorAll(".lane").forEach(l=>l.classList.toggle("on",+l.dataset.i===i));$("#close").focus();
}
function hide(){$("#drawer").classList.remove("on");$("#drawer").setAttribute("aria-hidden","true");$("#shade").classList.remove("on");
  const was=openRow;openRow=null;document.querySelectorAll(".lane.on").forEach(l=>l.classList.remove("on"));
  const l=document.querySelector('.lane[data-i="'+was+'"]');if(l)l.focus();}

/* ---- wiring ---- */
document.addEventListener("click",e=>{
  const f=e.target.closest("[data-f]");if(f){pick=f.dataset.f===pick||!f.dataset.f?null:f.dataset.f;render();return}
  const m=e.target.closest("#range button");if(m){months=+m.dataset.m;sync();render();return}
  const o=e.target.closest("#sort button");if(o){order=o.dataset.s;sync();render();return}
  const l=e.target.closest(".lane");if(l){show(+l.dataset.i);return}
  if(e.target.closest("#close")||e.target.id==="shade")hide();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&openRow!==null)hide();
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".story .f")){e.preventDefault();e.target.click();
    const k=e.target.dataset.f;requestAnimationFrame(()=>{const n=document.querySelector('.story .f[data-f="'+k+'"]');if(n)n.focus()})}
});
$("#q").addEventListener("input",render);
function sync(){document.querySelectorAll("#range button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.m===months));
  document.querySelectorAll("#sort button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===order));}
sync();render();

$("#foot").innerHTML="Shortage reports come from Health Product Shortages Canada ("+Number(DATA.scanned).toLocaleString("en-CA")+
  " reports checked). Import permits come from Health Canada’s List of Drugs for Exceptional Importation and Sale ("+DATA.import_rows+
  " entries). Hikma products are from the Hikma US injectables catalog. Rebuilt every Monday."+
  (DATA.warnings.length?"<details><summary>Data notes ("+DATA.warnings.length+")</summary><ul>"+DATA.warnings.map(w=>"<li>"+esc(w)+"</li>").join("")+"</ul></details>":"");
})();
</script></body></html>
